#overlay {
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:rgba(8,14,10,0.38);
}

/* Canvas animated lines */
#bg-canvas {
  position:fixed; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:0; opacity:0.18;
}

/* Header */
header {
  background: rgba(0,0,0,0.92);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-bottom:2px solid var(--gold);
  padding:14px 24px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100;
  box-shadow:0 4px 24px rgba(0,0,0,0.5);
}
.h-title h1 { font-size:1.05rem; font-weight:700; color:#fff; }
.h-title p { font-size:0.72rem; color:var(--gold); margin-top:2px; }
.h-actions { display:flex; gap:8px; align-items:center; }
.btn {
  padding:7px 16px; border-radius:99px; cursor:pointer;
  font-family:'Google Sans','Heebo',sans-serif;
  font-size:0.82rem; font-weight:600;
  display:inline-flex; align-items:center; gap:6px;
  transition:all 0.15s; border:1px solid;
}
.btn-teal { background:rgba(77,182,172,0.15); color:var(--teal); border-color:rgba(77,182,172,0.4); }
.btn-teal:hover { background:rgba(77,182,172,0.25); }
.btn-outline { background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.7); border-color:rgba(255,255,255,0.2); }
.btn-outline:hover { background:rgba(255,255,255,0.12); color:#fff; }
#last-update { font-size:0.7rem; color:var(--text2); }

main { max-width:1100px; margin:0 auto; padding:20px 16px 40px; position:relative; z-index:10; }

/* Metrics */
.metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
.metric {
  background:transparent;
  border:1.5px solid rgba(255,255,255,0.18);
  border-radius:var(--r);
  padding:18px 16px; text-align:center;
  backdrop-filter:blur(12px);
}
.metric-num { font-size:2.2rem; font-weight:900; line-height:1; }
.metric-lbl { font-size:0.68rem; color:var(--text2); margin-top:5px; text-transform:uppercase; letter-spacing:1px; }
.ok-num { color:var(--teal); }
.bad-num { color:var(--red); }
.total-num { color:#fff; }
.rate-num { color:var(--gold); }

/* Charts */
.charts { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
.chart-card {
  background:transparent;
  border:1.5px solid rgba(255,255,255,0.18);
  border-radius:var(--r); padding:16px;
  backdrop-filter:blur(12px);
}
.card-title {
  font-size:0.68rem; font-weight:700; color:var(--text2);
  margin-bottom:12px; text-transform:uppercase; letter-spacing:1.5px;
}

/* Defects */
.defects-card {
  background:rgba(239,83,80,0.06);
  border:1.5px solid rgba(239,83,80,0.25);
  border-radius:var(--r); padding:16px; margin-bottom:16px;
  backdrop-filter:blur(12px);
}
.defects-title { font-size:0.68rem; font-weight:700; color:var(--red); margin-bottom:12px; text-transform:uppercase; letter-spacing:1.5px; }
.defect-item { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid rgba(239,83,80,0.1); font-size:0.85rem; }
.defect-item:last-child { border-bottom:none; }
.defect-count { color:var(--red); font-weight:700; }

/* Table */
.table-card {
  background:transparent;
  border:1.5px solid rgba(255,255,255,0.18);
  border-radius:var(--r); padding:16px;
  backdrop-filter:blur(12px);
}
table { width:100%; border-collapse:collapse; font-size:0.84rem; }
th {
  text-align:right; padding:8px 10px;
  color:var(--text2); font-weight:700; font-size:0.65rem;
  border-bottom:1px solid rgba(255,255,255,0.08);
  text-transform:uppercase; letter-spacing:1px;
}
td { padding:11px 10px; border-bottom:1px solid rgba(255,255,255,0.05); color:#e0e0e0; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:rgba(77,182,172,0.05); }
.badge { display:inline-block; padding:3px 10px; border-radius:99px; font-size:0.7rem; font-weight:700; }
.badge-ok { background:rgba(77,182,172,0.18); color:var(--teal); }
.badge-bad { background:rgba(239,83,80,0.18); color:var(--red); }
.badge-partial { background:rgba(255,202,40,0.18); color:var(--gold); }

/* Loading */
.loading { text-align:center; padding:80px; color:var(--text2); position:relative; z-index:10; }
.spin { display:inline-block; width:36px; height:36px; border:3px solid rgba(77,182,172,0.2); border-top-color:var(--teal); border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:14px; }
@keyframes spin { to { transform:rotate(360deg); } }

@media(max-width:640px) {
  .metrics { grid-template-columns:1fr 1fr; }
  .charts { grid-template-columns:1fr; }
  header { padding:12px 14px; flex-wrap:wrap; gap:8px; }
}
</style>
</head>

<div id="car-bg"></div>
<div id="overlay"></div>
<canvas id="bg-canvas"></canvas>

<header>
  <div class="h-title">
    <h1>📊 דשבורד ביקורות רכב</h1>
    <p>מחלקת תחבורה — מגב ירושלים | מתעדכן מ-Google Sheets</p>
  </div>
  <div class="h-actions">
    <span id="last-update"></span>
    <button class="btn btn-teal" onclick="loadData()">🔄 רענן</button>
    <button class="btn btn-outline" onclick="location.href='index.html'">← חזור לטופס</button>
  </div>
</header>

<main>
  <div id="loading" class="loading">
    <div class="spin"></div>
    <div>טוען נתונים...</div>
  </div>

  <div id="content" style="display:none;">
    <div class="metrics">
      <div class="metric"><div class="metric-num total-num" id="m-total">0</div><div class="metric-lbl">סה"כ בדיקות</div></div>
      <div class="metric"><div class="metric-num ok-num" id="m-ok">0</div><div class="metric-lbl">תקין לשירות</div></div>
      <div class="metric"><div class="metric-num bad-num" id="m-bad">0</div><div class="metric-lbl">לא תקין</div></div>
      <div class="metric"><div class="metric-num rate-num" id="m-rate">0%</div><div class="metric-lbl">שיעור תקינות</div></div>
    </div>

    <div class="charts">
      <div class="chart-card">
        <div class="card-title">בדיקות לפי שבוע</div>
        <div style="position:relative;height:180px;">
          <canvas id="weekChart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <div class="card-title">תוצאות בדיקות</div>
        <div style="position:relative;height:180px;">
          <canvas id="resultChart"></canvas>
        </div>
      </div>
    </div>

    <div id="defects-section" class="defects-card" style="display:none;">
      <div class="defects-title">⚠️ ליקויים נפוצים</div>
      <div id="defects-list"></div>
    </div>

    <div class="table-card">
      <div class="card-title">בדיקות אחרונות</div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>תאריך</th>
              <th>מס רישוי</th>
              <th>מד אוץ</th>
              <th>בודק</th>
              <th>יחידה</th>
              <th>תקין</th>
              <th>לא תקין</th>
              <th>מסקנה</th>
            </tr>
          </thead>
          <tbody id="rows-table"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="error-msg" style="display:none;text-align:center;padding:60px;color:var(--text2);">
    ❌ לא ניתן לטעון נתונים
  </div>
</main>

<script>
// Canvas animation
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, offset = 0;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  function draw() {
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(255,202,40,0.6)'; ctx.lineWidth = 1;
    for (let x = -H + offset % 60; x < W+H; x += 60) {
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+H,H); ctx.stroke();
    }
    offset += 0.3;
    requestAnimationFrame(draw);
  }
  draw();
})();

const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzepPEcojy2fs8ApnBs7EX7oFvZsIH0hxllG5iOJLT9_pyPSyqAFgvT1hxuGATqEasO/exec';
let weekChart, resultChart;

async function loadData() {
  document.getElementById('loading').style.display='block';
  document.getElementById('content').style.display='none';
  document.getElementById('error-msg').style.display='none';
  try {
    const res = await fetch(SHEETS_URL + '?action=dashboard');
    const json = await res.json();
    const rows = json.rows || [];
    if (!rows.length) {
      document.getElementById('loading').style.display='none';
      document.getElementById('error-msg').style.display='block';
      document.getElementById('error-msg').textContent='אין נתונים עדיין';
      return;
    }
    renderDashboard(rows);
    document.getElementById('last-update').textContent = 'עודכן: ' + new Date().toLocaleTimeString('he-IL');
    document.getElementById('loading').style.display='none';
    document.getElementById('content').style.display='block';
  } catch(e) {
    console.error(e);
    document.getElementById('loading').style.display='none';
    document.getElementById('error-msg').style.display='block';
  }
}

function renderDashboard(rows) {
  const total = rows.length;
  const okRows = rows.filter(r=>(r.conclusion||'').includes('תקין לשירות'));
  const badRows = rows.filter(r=>(r.conclusion||'').includes('מוצא מכלל'));
  const rate = total ? Math.round(okRows.length/total*100) : 0;

  document.getElementById('m-total').textContent = total;
  document.getElementById('m-ok').textContent = okRows.length;
  document.getElementById('m-bad').textContent = badRows.length;
  document.getElementById('m-rate').textContent = rate+'%';

  // Weekly chart
  const weekMap = {};
  rows.forEach(r => {
    const d = r.date||'';
    let week = 'לא ידוע';
    if (d) { try { week = 'שבוע '+Math.ceil(new Date(d).getDate()/7); } catch(e) {} }
    weekMap[week] = (weekMap[week]||0)+1;
  });
  if (weekChart) weekChart.destroy();
  weekChart = new Chart(document.getElementById('weekChart'), {
    type:'bar',
    data:{ labels:Object.keys(weekMap), datasets:[{ label:'בדיקות', data:Object.values(weekMap), backgroundColor:'#4db6ac', borderRadius:6 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{
        y:{ beginAtZero:true, ticks:{color:'rgba(255,255,255,0.45)',font:{size:11}}, grid:{color:'rgba(255,255,255,0.06)'} },
        x:{ ticks:{color:'rgba(255,255,255,0.45)',font:{size:11}}, grid:{display:false} }
      }
    }
  });

  // Result chart
  const partial = rows.filter(r=>(r.conclusion||'').includes('בכפוף')).length;
  if (resultChart) resultChart.destroy();
  resultChart = new Chart(document.getElementById('resultChart'), {
    type:'doughnut',
    data:{ labels:['תקין','לא תקין','בכפוף'], datasets:[{ data:[okRows.length,badRows.length,partial], backgroundColor:['#4db6ac','#ef5350','#ffca28'], borderWidth:2, borderColor:'rgba(0,0,0,0.4)' }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ color:'rgba(255,255,255,0.55)', font:{size:11}, padding:10 } } },
      cutout:'62%'
    }
  });

  // Defects
  const defMap = {};
  rows.forEach(r => {
    const d = r.defects||'';
    if (d) d.split('|').forEach(i => { const t=i.trim(); if(t) defMap[t]=(defMap[t]||0)+1; });
  });
  const top = Object.entries(defMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if (top.length) {
    document.getElementById('defects-section').style.display='block';
    document.getElementById('defects-list').innerHTML = top.map(([n,c])=>
      `<div class="defect-item"><span>${n}</span><span class="defect-count">${c}×</span></div>`
    ).join('');
  }

  // Table
  const recent = [...rows].reverse().slice(0,20);
  document.getElementById('rows-table').innerHTML = recent.map(r => {
    const conc = r.conclusion||'';
    const cls = conc.includes('תקין לשירות')?'badge-ok':conc.includes('מוצא')?'badge-bad':'badge-partial';
    const km = r.km ? Number(r.km).toLocaleString()+" קמ'" : '—';
    return `<tr>
      <td>${r.date||'—'}</td>
      <td style="font-weight:600;">${r.reg||'—'}</td>
      <td style="color:#ffca28;font-weight:600;">${km}</td>
      <td>${r.inspector||'—'}</td>
      <td>${r.unit||'—'}</td>
      <td style="color:#4db6ac;font-weight:700;">${r.ok_count??'—'}</td>
      <td style="color:#ef5350;font-weight:700;">${r.bad_count??'—'}</td>
      <td><span class="badge ${cls}">${conc||'—'}</span></td>
    </tr>`;
  }).join('');
}

loadData();
</script>
</body>
</html>
